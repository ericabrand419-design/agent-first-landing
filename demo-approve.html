<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Agent First | Demo Approval</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f3fa;color:#171a2b;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(760px,calc(100% - 28px));margin:56px auto}
.card{background:#fff;border:1px solid #e1ddec;border-radius:20px;padding:24px;box-shadow:0 18px 55px rgba(45,37,82,.10)}
.ey{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7c3aed}.muted{color:#70758b}.grid{display:grid;gap:12px;margin-top:18px}
label{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#73778b}
input{width:100%;border:1px solid #ddd8e8;border-radius:10px;padding:10px 11px;font:inherit}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.primary{color:#fff;background:linear-gradient(102deg,#ff7352,#e94ea7 47%,#8b37f4)}.ghost{background:#f7f5fb;color:#4e536a;border:1px solid #ddd8e8}
#result{margin-top:18px;padding:14px;border:1px solid #e1ddec;border-radius:12px;background:#faf9fd}#result[hidden]{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font-size:12px;min-height:20px;margin-top:8px}
code{display:block;white-space:pre-wrap;word-break:break-all;background:#11162c;color:#f4f4fb;padding:10px;border-radius:9px;font-size:11px}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="ey">Owner only</div>
    <h1>Approve private demo access</h1>
    <p class="muted">Requests do not get access automatically. Enter the prospect's email and your approval code to issue a seven-day private demo invitation.</p>

    <form id="approveForm" class="grid">
      <div>
        <label for="email">Prospect email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div>
        <label for="code">Approval code</label>
        <input id="code" type="password" required autocomplete="off">
      </div>
      <button class="primary" type="submit">Approve and generate demo link</button>
      <div id="status" class="status"></div>
    </form>

    <div id="result" hidden>
      <div class="ey">Approved invitation</div>
      <p class="muted" id="expires"></p>
      <code id="link"></code>
      <div class="actions">
        <button id="copyBtn" class="ghost" type="button">Copy link</button>
        <button id="openBtn" class="primary" type="button">Open Deal Room activation</button><button id="openDemoBtn" class="ghost" type="button">Open demo activation</button>
        <button id="emailBtn" class="ghost" type="button">Email link</button>
      </div>
    </div>
  </section>
</main>
<script>
(function(){
  var form=document.getElementById('approveForm');
  var status=document.getElementById('status');
  var result=document.getElementById('result');
  var linkEl=document.getElementById('link');
  var currentUrl='';
  var currentDemoUrl='';
  var currentEmail='';

  form.addEventListener('submit',function(e){
    e.preventDefault();
    currentEmail=document.getElementById('email').value.trim().toLowerCase();
    var code=document.getElementById('code').value;
    var btn=form.querySelector('button[type="submit"]');
    btn.disabled=true;btn.textContent='Approving...';
    status.style.color='#6f7488';status.textContent='Creating private invitation...';
    result.hidden=true;

    fetch('/api/demo-invite',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({action:'issue',email:currentEmail,approvalCode:code})
    }).then(function(res){
      return res.json().then(function(data){return {ok:res.ok,data:data};});
    }).then(function(r){
      if(!r.ok||!r.data||!r.data.dealRoomUrl)throw new Error(r.data&&r.data.error||'Could not create private access.');
      currentUrl=r.data.dealRoomUrl;
      currentDemoUrl=r.data.portalUrl||'';
      linkEl.textContent=currentUrl;
      document.getElementById('expires').textContent='This invitation expires in '+(r.data.expiresInDays||7)+' days.';
      result.hidden=false;
      status.style.color='#177a55';status.textContent='Approved. Open the generated link to set or reset the shared Deal Room + Demo password.';
    }).catch(function(err){
      status.style.color='#b42318';status.textContent=err&&err.message?err.message:'Approval failed.';
    }).finally(function(){
      btn.disabled=false;btn.textContent='Approve and generate demo link';
    });
  });

  document.getElementById('copyBtn').onclick=function(){
    if(!currentUrl)return;
    navigator.clipboard.writeText(currentUrl);
    this.textContent='Copied';
    setTimeout(()=>this.textContent='Copy link',1200);
  };
  document.getElementById('openBtn').onclick=function(){if(currentUrl)window.open(currentUrl,'_blank','noopener');};
  document.getElementById('openDemoBtn').onclick=function(){if(currentDemoUrl)window.open(currentDemoUrl,'_blank','noopener');};
  document.getElementById('emailBtn').onclick=function(){
    if(!currentUrl||!currentEmail)return;
    var subject=encodeURIComponent('Your private Agent First access');
    var body=encodeURIComponent('Your Agent First private Deal Room + Demo access is ready:\n\n'+currentUrl+'\n\nThis invitation expires in 7 days.');
    location.href='mailto:'+encodeURIComponent(currentEmail)+'?subject='+subject+'&body='+body;
  };
})();
</script>
</body>
</html>
